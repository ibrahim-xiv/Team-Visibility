spring.application.name=TeamVisibility

# --- H2 persistent file database -------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/teamvisibility;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- H2 console (http://localhost:8080/h2-console) -------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Static resources / errors --------------------------------------------
# Show register.html, login.html, home.html etc. directly from /static
spring.web.resources.add-mappings=true

# --- Logging --------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.com.TeamVisibility=DEBUG

server.port=8080
