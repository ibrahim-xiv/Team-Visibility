spring.application.name=TeamVisibility

# --- Datasource wird von DataSourceConfig.java verwaltet -------------------
# (handled programmatically to convert postgresql:// to jdbc:postgresql://)

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- H2 console (nur lokal) ------------------------------------------------
spring.h2.console.enabled=false

# --- Static resources ------------------------------------------------------
spring.web.resources.add-mappings=true

# --- Logging ---------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.com.TeamVisibility=DEBUG

# --- Port ------------------------------------------------------------------
server.port=${PORT:8080}

# --- Gmail SMTP ------------------------------------------------------------
gmail.username=${GMAIL_USERNAME:deine@gmail.com}
gmail.app.password=${GMAIL_APP_PASSWORD:xxxx xxxx xxxx xxxx}