spring.application.name=App
spring.datasource.url=jdbc:h2:mem:nachbarschaftdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false

# Damit wir die Datenbank im Browser ansehen können:
spring.h2.console.enabled=true

# Email-Versand fuer Registrierungscodes (bei Bedarf an SMTP-Server)
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=visibility@example.com
# spring.mail.password=secret
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
visibility.mail.from=no-reply@visibility.local

server.port=5173

# Damit wir die Datenbank im Browser ansehen können:
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console