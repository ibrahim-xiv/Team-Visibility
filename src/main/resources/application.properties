spring.application.name=TeamVisibility

# --- Datasource (H2 lokal, Postgres auf Render via env vars) ---------------
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/teamvisibility;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- H2 console (nur lokal) ------------------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# --- Static resources ------------------------------------------------------
spring.web.resources.add-mappings=true

# --- Logging ---------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.com.TeamVisibility=DEBUG

# --- Port (Render setzt PORT automatisch) ----------------------------------
server.port=${PORT:8080}

# --- Resend E-Mail ---------------------------------------------------------
resend.api.key=${RESEND_API_KEY:KEIN_KEY_GESETZT}
resend.from.email=${RESEND_FROM_EMAIL:noreply@yourdomain.com}