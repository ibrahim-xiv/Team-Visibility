spring.application.name=TeamVisibility

# --- Datasource (H2 file locally, Postgres on Render via env vars) ---------
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/teamvisibility;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- H2 console (only enabled locally) -------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# --- Static resources ------------------------------------------------------
spring.web.resources.add-mappings=true

# --- Logging --------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.com.TeamVisibility=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG

# --- Diagnostic: log the resolved values at startup (REMOVE THIS LATER) -----
logging.level.com.zaxxer.hikari=DEBUG

# --- Port (Render injects PORT; fall back to 8080 locally) -----------------
server.port=${PORT:8080}