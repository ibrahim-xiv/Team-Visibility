<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Kartenansicht</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --border-color: #ccc;
      --bg-light: #f9f9f9;
      --text-main: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Nunito', sans-serif; 
      background-color: #f4f4f4; 
      display: flex; 
      justify-content: center; 
      height: 100vh;
    }

    /* Hauptcontainer ohne den dicken schwarzen Rahmen */
    .app-container {
      width: 375px;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    /* Dünnerer Header */
    .header {
      padding: 10px 15px; /* Reduziertes Padding für dünneren Look */
      background: white;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eee;
      height: 60px;
    }
    
    .back-btn-box {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.5rem;
      font-weight: bold;
    }

    .header h1 { 
      flex: 1;
      font-size: 1.1rem; 
      color: var(--text-main); 
      text-align: center;
      margin-right: 40px; /* Ausgleich für den Button links */
    }

    /* Karten-Bereich */
    .map-content {
      flex: 1;
      position: relative;
    }
    #map { width: 100%; height: 100%; z-index: 1; }

    /* Overlay Steuerung */
    .map-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;
    }

    .filter-bar {
      width: 100%;
      pointer-events: auto;
    }

    .filter-select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: white;
      font-size: 14px;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 15px;
    }

    /* Marker Icons */
    .event-pin {
      background: #28a745;
      color: white;
      border: 2px solid white;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pin-text { transform: rotate(45deg); font-weight: bold; font-size: 12px; }

    .home-pin {
      background: #3b82f6;
      border: 2px solid white;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Bottom Nav */
    .bottom-nav {
      height: 70px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #eee;
      padding-bottom: 5px;
    }
    .nav-btn { color: var(--text-main); text-decoration: none; display: flex; align-items: center; }
    .nav-btn svg { width: 24px; height: 24px; }
    
    .nav-btn.is-primary {
      border: 1px solid var(--border-color);
      padding: 5px 20px;
      border-radius: 8px;
      font-size: 1.4rem;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <header class="header">
      <a href="home.html" class="back-btn-box">&#8249;</a>
      <h1>Karte</h1>
    </header>

    <section class="map-content">
      <div class="map-overlay">
        <div class="filter-bar">
          <select class="filter-select">
            <option value="eventkategorie">Event Kategorie</option>
            <option value="freizeit">Freizeit</option>
            <option value="sport">Sport</option>
            <option value="spieleabend">Spieleabend</option>
            <option value="kultur">Kultur</option>
            <option value="community">Community</option>
            <option value="anderes">Anderes...</option>
          </select>
        </div>
      </div>

      <div id="map"></div>
    </section>

    <nav class="bottom-nav">
      <a class="nav-btn" href="home.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
      <a class="nav-btn" href="chat.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></a>
      <a class="nav-btn is-primary" href="meeting-form.html">+</a>
      <a class="nav-btn" href="saved.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></a>
      <a class="nav-btn" href="profile.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></a>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([53.522, 8.115], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function addMarker(lat, lng, label) {
      const icon = L.divIcon({
        className: 'custom-icon',
        html: `<div class="event-pin"><span class="pin-text">${label}</span></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 30]
      });
      L.marker([lat, lng], { icon: icon }).addTo(map);
    }

    // Beispiel-Marker wie auf deinem Bild
    addMarker(53.528, 8.108, 'C');
    addMarker(53.526, 8.125, 'D');
    addMarker(53.522, 8.108, 'E');
    addMarker(53.518, 8.135, 'F');
    addMarker(53.517, 8.128, 'G');
    addMarker(53.513, 8.105, 'A');

    // Haus-Marker (Standort)
    const userLoc = [53.521, 8.118];
    const homeIcon = L.divIcon({
      className: 'home-icon',
      html: `<div class="home-pin">🏠</div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17]
    });
    L.marker(userLoc, { icon: homeIcon }).addTo(map);

    // Sichtbarkeitskreis
    L.circle(userLoc, {
      color: 'red',
      weight: 2,
      fillColor: '#f03',
      fillOpacity: 0.1,
      radius: 450
    }).addTo(map);
  </script>
</body>
</html>
