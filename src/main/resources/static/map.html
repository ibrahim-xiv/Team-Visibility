<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Kartenansicht</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* Nur das spezifische Styling für die Karte und die Pins */
    .map-content {
      position: relative;
      flex: 1; /* Füllt den gesamten Platz zwischen Header und Nav */
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    #map { 
      width: 100%; 
      flex: 1; 
      z-index: 1; 
    }

    /* Overlay Steuerung (Dropdown auf der Karte) */
    .map-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;
    }

    .filter-bar {
      width: 100%;
      pointer-events: auto;
    }

    .filter-select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color, #ccc);
      border-radius: 12px;
      background: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* Marker Icons vom Kollegen */
    .event-pin {
      background: #28a745;
      color: white;
      border: 2px solid white;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    
    .pin-text { 
      transform: rotate(45deg); 
      font-weight: bold; 
      font-size: 12px; 
    }

    .home-pin {
      background: #3b82f6;
      border: 2px solid white;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>
  <main class="phone" style="display: flex; flex-direction: column;">
    
    <header class="header has-back">
      <a class="back-btn" href="home.html" aria-label="Zurück">&#8249;</a>
      <h1>Karte</h1>
    </header>

    <section class="map-content">
      
      <div class="map-overlay">
        <div class="filter-bar">
          <select class="filter-select">
            <option value="eventkategorie">Event Kategorie wählen...</option>
            <option value="freizeit">Freizeit</option>
            <option value="sport">Sport</option>
            <option value="spieleabend">Spieleabend</option>
            <option value="kultur">Kultur</option>
            <option value="community">Community</option>
            <option value="anderes">Anderes...</option>
          </select>
        </div>
      </div>

      <div id="map"></div>
      
    </section>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a class="nav-btn" href="home.html" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"></path></svg>
      </a>
      <a class="nav-btn" href="chat.html" aria-label="Chat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>
      </a>
      <a class="nav-btn is-primary" href="meeting-form.html" aria-label="Treffen erstellen">+</a>
      <a class="nav-btn" href="saved.html" aria-label="Gespeicherte Inhalte">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg>
      </a>
      <a class="nav-btn" href="profile.html" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"></path></svg>
      </a>
    </nav>
  </main> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Karte initialisieren
    const map = L.map('map', { zoomControl: false }).setView([53.522, 8.115], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function addMarker(lat, lng, label) {
      const icon = L.divIcon({
        className: 'custom-icon',
        html: `<div class="event-pin"><span class="pin-text">${label}</span></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 30]
      });
      L.marker([lat, lng], { icon: icon }).addTo(map);
    }

    // Beispiel-Marker wie auf deinem Bild
    addMarker(53.528, 8.108, 'C');
    addMarker(53.526, 8.125, 'D');
    addMarker(53.522, 8.108, 'E');
    addMarker(53.518, 8.135, 'F');
    addMarker(53.517, 8.128, 'G');
    addMarker(53.513, 8.105, 'A');

    // Haus-Marker (Standort)
    const userLoc = [53.521, 8.118];
    const homeIcon = L.divIcon({
      className: 'home-icon',
      html: `<div class="home-pin">🏠</div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17]
    });
    L.marker(userLoc, { icon: homeIcon }).addTo(map);

    // Sichtbarkeitskreis
    L.circle(userLoc, {
      color: 'red',
      weight: 2,
      fillColor: '#f03',
      fillOpacity: 0.1,
      radius: 450
    }).addTo(map);
  </script>

  <nav class="dev-nav">
    <div class="dev-nav-header">DEV-Navigation</div>
    <div><a href="login.html" class="dev-btn">🔑 Login</a></div>
    <div><a href="register.html" class="dev-btn">📝 Registrieren</a></div>
    <div><a href="home.html" class="dev-btn">🏠 Home</a></div>
    <div><a href="meeting-form.html" class="dev-btn">➕ Erstellen</a></div>
    <div><a href="saved.html" class="dev-btn">💾 Gespeichert</a></div>
    <div><a href="profile.html" class="dev-btn">👤 Eigenes Profil</a></div>
    <div><a href="profile-view.html" class="dev-btn">👁️ Fremdes Profil</a></div>
    <div><a href="profile-edit.html" class="dev-btn">✏️ Profil bearbeiten</a></div>
    <div><a href="map.html" class="dev-btn">🗺️ Kartenansicht</a></div>
    <div class="dev-btn is-disabled">🚫📝 Event Details</div>
    <div class="dev-btn is-disabled">🚫💬 Chat</div>
  </nav>

</body>
</html>
