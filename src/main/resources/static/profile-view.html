<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visibility – Profil</title>
  <link rel="stylesheet" href="style.css?v=5"/>
  <style>
    .pv-card{text-align:center;padding:24px 0 16px;}
    .pv-avatar{width:84px;height:84px;border-radius:50%;background:var(--hover-bg);border:2px solid var(--border);display:grid;place-items:center;margin:0 auto 12px;font-size:3rem;line-height:1;}
    .pv-avatar svg{width:50px;height:50px;color:var(--muted);}
    .pv-name{font-size:1.4rem;font-weight:800;margin:0 0 4px;}
    .pv-username{color:var(--muted);font-size:0.85rem;margin:0 0 8px;}
    .pv-followers{display:inline-block;background:var(--hover-bg);border-radius:20px;padding:4px 14px;font-size:0.85rem;font-weight:700;margin-bottom:12px;}
    .pv-bio{font-size:0.9rem;color:var(--text);margin:0 0 12px;line-height:1.5;}
    .pv-interests{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px;}
    .interest-chip{background:var(--hover-bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:0.8rem;font-weight:700;}
    .pv-location{font-size:0.85rem;color:var(--muted);margin-bottom:8px;}
    .pv-actions{display:flex;gap:10px;margin-bottom:16px;}
    .pv-actions button{flex:1;}
    .pv-event{padding:10px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;}
    .pv-event a{text-decoration:none;color:var(--text);font-weight:700;}
  </style>
</head>
<body>
<script>if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');</script>
<main class="phone">
  <header class="header has-back"><a class="back-btn" href="javascript:history.back();">&#8249;</a><div class="brand"><span>Profil</span></div></header>
  <div class="scroll-area">
    <section class="content">
      <div class="pv-card">
        <div class="pv-avatar" id="pvAvatar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg></div>
        <h2 class="pv-name" id="pvName">Wird geladen…</h2>
        <p class="pv-username" id="pvUsername"></p>
        <p class="pv-followers"><span id="pvFollowerCount">0</span> Follower</p>
        <p class="pv-bio" id="pvBio"></p>
        <p class="pv-location" id="pvLocation"></p>
        <div class="pv-interests" id="pvInterests"></div>
      </div>
      <div class="pv-actions">
        <button onclick="openChat()" class="submit-btn">💬 Nachricht</button>
        <button onclick="toggleFollow()" class="submit-btn" id="followBtn" style="background:var(--hover-bg);color:var(--text);border:1px solid var(--border);">+ Folgen</button>
      </div>
      <div>
        <h3 style="font-size:1rem;font-weight:800;margin-bottom:10px;">Events</h3>
        <div id="pvEvents"><p style="color:var(--muted);font-size:0.85rem;">Wird geladen…</p></div>
      </div>
    </section>
  </div>
</main>
<script src="app.js?v=5"></script>
<script>
const uid=new URLSearchParams(window.location.search).get('id');
let following=false;

async function load(){
  if(!uid){document.getElementById('pvName').textContent='Nicht gefunden';return;}
  try{
    const r=await fetch('/api/users/'+uid);const u=await r.json();
    document.getElementById('pvName').textContent=u.firstName+' '+u.lastName;
    document.getElementById('pvUsername').textContent='@'+u.username;
    document.getElementById('pvFollowerCount').textContent=u.followerCount||0;
    if(u.avatar)document.getElementById('pvAvatar').textContent=u.avatar;
    if(u.bio)document.getElementById('pvBio').textContent=u.bio;
    if(u.locationName)document.getElementById('pvLocation').textContent='📍 '+u.locationName;
    if(u.interests)document.getElementById('pvInterests').innerHTML=u.interests.split(',').filter(i=>i).map(i=>'<span class="interest-chip">'+i+'</span>').join('');

    // Check follow status
    const fr=await fetch('/api/users/'+uid+'/is-following');const fd=await fr.json();
    following=fd.following;updateFollowBtn();

    // Events
    const mr=await fetch('/api/meetings');const all=await mr.json();
    const theirs=all.filter(e=>e.creatorId===Number(uid));const el=document.getElementById('pvEvents');
    if(!theirs.length){el.innerHTML='<p style="color:var(--muted);font-size:0.85rem;">Keine Events.</p>';return;}
    el.innerHTML=theirs.map(e=>`<div class="pv-event"><a href="event-details.html?id=${e.id}">${e.title}</a><br><span style="font-size:0.8rem;color:var(--muted);">${e.locationName||''}</span></div>`).join('');
  }catch(e){}
}

function updateFollowBtn(){
  const btn=document.getElementById('followBtn');
  if(following){btn.textContent='✓ Folge ich';btn.style.background='var(--primary)';btn.style.color='#fff';btn.style.borderColor='var(--primary)';}
  else{btn.textContent='+ Folgen';btn.style.background='var(--hover-bg)';btn.style.color='var(--text)';btn.style.borderColor='var(--border)';}
}

async function toggleFollow(){
  const action=following?'unfollow':'follow';
  try{
    const r=await fetch('/api/users/'+uid+'/'+action,{method:'POST'});
    const d=await r.json();
    if(r.ok){following=d.following;document.getElementById('pvFollowerCount').textContent=d.followerCount;updateFollowBtn();}
    else alert(d.error||'Fehler');
  }catch(e){alert('Fehler');}
}

function openChat(){localStorage.setItem('chat-open-recipient',uid);window.location.href='chat.html';}
load();
</script>
</body></html>
