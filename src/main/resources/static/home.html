<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    const user = JSON.parse(localStorage.getItem('tv-user') || 'null');
    if (!user) window.location.href = 'login.html';
  </script>

  <main class="phone is-feed">
    <div class="header-wrap" id="top">
      <header class="header">
        <div class="brand" aria-label="Visibility">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path>
              <circle cx="12" cy="12" r="3.2"></circle>
            </svg>
          </span>
          <span>Visibility</span>
        </div>
      </header>
      <div class="toolbar-wrap">
        <div class="toolbar">
          <input id="searchInput" class="search-input" type="text" placeholder="Suchen" aria-label="Event suchen">
          <select id="sortSelect" aria-label="Sortieren">
            <option value="date">Datum</option>
            <option value="title">Titel A–Z</option>
          </select>
          <select id="filterSelect" aria-label="Filtern">
            <option value="all">Alle</option>
            <option value="upcoming">Kommende</option>
            <option value="past">Vergangene</option>
            <option>Freizeit</option>
            <option>Sport</option>
            <option>Spieleabend</option>
            <option>Kultur</option>
            <option>Community</option>
            <option>Anderes…</option>
          </select>
        </div>
      </div>
    </div>

    <div class="scroll-area" id="scrollArea">
      <section class="content">
        <a class="map-cta" href="map.html" aria-label="Zur Kartenansicht">
          <span>Zur Kartenansicht</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"></path>
            <circle cx="12" cy="10" r="2.2"></circle>
          </svg>
        </a>
        <div class="section-head">
          <h2 id="sectionTitle">Events:</h2>
          <span class="results-count" id="resultsCount"></span>
        </div>
        <div class="event-list" id="eventList">
          <p style="color:var(--muted);font-size:0.9rem;padding:12px 0;">Events werden geladen…</p>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">Keine Events gefunden. Erstelle das erste!</div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a class="nav-btn home-btn is-active" href="#top" id="homeBtn" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"></path></svg>
      </a>
      <a class="nav-btn" href="chat.html" aria-label="Chat">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>
      </a>
      <a class="nav-btn is-primary" href="meeting-form.html" aria-label="Treffen erstellen">+</a>
      <a class="nav-btn" href="saved.html" aria-label="Gespeicherte Inhalte">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
      </a>
      <a class="nav-btn" href="profile.html" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"></path></svg>
      </a>
    </nav>
  </main>

  <script src="app.js"></script>
  <script>
    const TODAY = new Date(); TODAY.setHours(0,0,0,0);
    const SAVED_KEY = 'visibility-saved';
    let allEvents = [];
    let savedIds = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]');

    const categoryEmoji = { 'Sport':'🏃','Spieleabend':'🎲','Kultur':'🎭','Freizeit':'🎉','Community':'👥','Anderes…':'✨' };

    async function loadEvents() {
      try {
        const res = await fetch('/api/meetings');
        allEvents = await res.json();
        renderFiltered();
      } catch(e) {
        document.getElementById('eventList').innerHTML = '<p style="color:var(--muted)">Fehler beim Laden.</p>';
      }
    }

    function formatDate(dt) {
      if (!dt) return '';
      const d = new Date(dt);
      return d.toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' });
    }

    function isPast(dt) {
      if (!dt) return false;
      return new Date(dt) < TODAY;
    }

    function renderFiltered() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;
      const filter = document.getElementById('filterSelect').value;
      const user = JSON.parse(localStorage.getItem('tv-user') || 'null');

      let list = [...allEvents];

      if (search) list = list.filter(e => (e.title||'').toLowerCase().includes(search) || (e.locationName||'').toLowerCase().includes(search));
      if (filter === 'upcoming') list = list.filter(e => !isPast(e.dateTime));
      else if (filter === 'past') list = list.filter(e => isPast(e.dateTime));
      else if (filter !== 'all') list = list.filter(e => e.category === filter);

      if (sort === 'date') list.sort((a,b) => new Date(a.dateTime) - new Date(b.dateTime));
      else if (sort === 'title') list.sort((a,b) => (a.title||'').localeCompare(b.title||''));

      const eventList = document.getElementById('eventList');
      const emptyState = document.getElementById('emptyState');
      document.getElementById('resultsCount').textContent = `${list.length} Treffer`;

      if (!list.length) { eventList.innerHTML = ''; emptyState.style.display = 'block'; return; }
      emptyState.style.display = 'none';

      eventList.innerHTML = list.map(e => {
        const past = isPast(e.dateTime);
        const saved = savedIds.includes(e.id);
        const isOwn = user && e.creatorId === user.id;
        const emoji = categoryEmoji[e.category] || '✨';
        return `
        <article class="event-row">
          <a class="event-card ${isOwn ? 'is-own-event' : ''} ${past ? 'is-past' : ''}" href="event-details.html?id=${e.id}">
            <div class="event-badge"><span>${emoji}</span><span>${e.category || 'Event'}</span></div>
            <h3 class="event-title">${e.title || 'Unbenannt'}</h3>
            <p class="event-meta">${formatDate(e.dateTime)}</p>
            <p class="event-location">${e.locationName || ''}</p>
          </a>
          <div class="event-side">
            <button class="icon-btn save-btn ${saved ? 'is-active' : ''}" type="button" data-id="${e.id}" aria-label="${saved ? 'Gespeichert' : 'Speichern'}">
              <svg viewBox="0 0 24 24" fill="${saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path>
              </svg>
            </button>
          </div>
        </article>`;
      }).join('');

      document.querySelectorAll('.save-btn').forEach(btn => {
        btn.onclick = ev => {
          ev.preventDefault();
          const id = Number(btn.getAttribute('data-id'));
          const active = btn.classList.toggle('is-active');
          btn.querySelector('svg').setAttribute('fill', active ? 'currentColor' : 'none');
          if (active) { if (!savedIds.includes(id)) savedIds.push(id); }
          else { savedIds = savedIds.filter(s => s !== id); }
          localStorage.setItem(SAVED_KEY, JSON.stringify(savedIds));
        };
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderFiltered);
    document.getElementById('sortSelect').addEventListener('change', renderFiltered);
    document.getElementById('filterSelect').addEventListener('change', renderFiltered);

    loadEvents();
  </script>
</body>
</html>
