<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Home</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
  </script>
  <main class="phone is-feed">

    <div class="header-wrap" id="top">
      <header class="header">
        <div class="brand" aria-label="Visibility">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path>
              <circle cx="12" cy="12" r="3.2"></circle>
            </svg>
          </span>
          <span>Visibility</span>
        </div>
      </header>

      <div class="toolbar-wrap">
        <div class="toolbar">
          <input id="searchInput" class="search-input" type="text" placeholder="Suchen" aria-label="Event suchen">
          <select id="sortSelect" aria-label="Sortieren">
            <option value="distance">Entfernung</option>
            <option value="date">Datum</option>
            <option value="title">Titel A–Z</option>
          </select>
          <select id="filterSelect" aria-label="Filtern">
            <option value="all">Alle</option>
            <option value="upcoming">Kommende</option>
            <option value="past">Vergangene</option>
            <option>Freizeit</option>
            <option>Sport</option>
            <option>Spieleabend</option>
            <option>Kultur</option>
            <option>Community</option>
            <option>Anderes…</option>
          </select>
        </div>
      </div>
    </div>

    <div class="scroll-area" id="scrollArea">
      <section class="content">

        <a class="map-cta" href="map.html" aria-label="Zur Kartenansicht">
          <span>Zur Kartenansicht</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"></path>
            <circle cx="12" cy="10" r="2.2"></circle>
          </svg>
        </a>

        <div class="section-head">
          <h2 id="sectionTitle">Events nach Entfernung:</h2>
          <span class="results-count" id="resultsCount"></span>
        </div>

        <div class="event-list" id="eventList">
          <p class="loading-hint" id="loadingHint" style="color: var(--muted); font-size: 0.9rem; padding: 12px 0;">
            Events werden geladen…
          </p>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">Keine passenden Events gefunden.</div>

      </section>
    </div>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a class="nav-btn home-btn is-active" href="#top" id="homeBtn" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"></path>
        </svg>
      </a>
      <a class="nav-btn" href="chat.html" aria-label="Chat">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path>
        </svg>
      </a>
      <a class="nav-btn is-primary" href="meeting-form.html" aria-label="Treffen erstellen">+</a>
      <a class="nav-btn" href="saved.html" aria-label="Gespeicherte Inhalte">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
      </a>
      <a class="nav-btn" href="profile.html" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"></path>
        </svg>
      </a>
    </nav>

    <div class="toast" id="reportToast" hidden></div>
    <div id="creationToast" class="toast-simple" hidden>Treffen wurde erfolgreich erstellt!</div>

  </main>

  <div class="overlay" id="reportOverlay" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
      <h2 id="reportTitle">Event melden</h2>
      <p>Warum möchtest du dieses Event melden? (Mehrfachauswahl möglich)</p>
      <form id="reportForm">
        <div class="report-list">
          <label class="report-option"><input type="checkbox" name="reportReason" value="Unangemessen"><span><strong>Unangemessen</strong><small>Beleidigend, sexuell oder gewaltbezogen.</small></span></label>
          <label class="report-option"><input type="checkbox" name="reportReason" value="Fake-Event"><span><strong>Fake-Event</strong><small>Wirkt erfunden oder irreführend.</small></span></label>
          <label class="report-option"><input type="checkbox" name="reportReason" value="Gefährlich"><span><strong>Gefährlich</strong><small>Unsicher oder ruft zu riskantem Verhalten auf.</small></span></label>
          <label class="report-option"><input type="checkbox" name="reportReason" value="Spam"><span><strong>Spam</strong><small>Werbung oder mehrfach gepostet.</small></span></label>
          <label class="report-option"><input type="checkbox" name="reportReason" value="Falsche Infos"><span><strong>Falsche Infos</strong><small>Kategorie, Ort oder Zeit stimmen nicht.</small></span></label>
        </div>
        <div id="reportError" style="color: #d95c5c; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; display: none;">Bitte wähle mindestens einen Grund aus.</div>
        <div class="overlay-actions">
          <button class="overlay-close" type="button" id="closeReportOverlay">Abbrechen</button>
          <button class="overlay-submit" type="submit">Meldung senden</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // KONFIGURATION – API-URL hier anpassen, sobald das Backend steht
    // ─────────────────────────────────────────────────────────────────────────
    const API_EVENTS_URL = '/api/events'; // TODO: echte URL eintragen

    const STORAGE_KEY = 'visibility-saved-events';
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    function isPast(dateStr) {
      if (!dateStr) return false;
      const d = new Date(dateStr);
      d.setHours(0, 0, 0, 0);
      return d < TODAY;
    }

    let events = [];
    let savedList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    const searchInput   = $('#searchInput');
    const sortSelect    = $('#sortSelect');
    const filterSelect  = $('#filterSelect');
    const eventList     = $('#eventList');
    const emptyState    = $('#emptyState');
    const resultsCount  = $('#resultsCount');
    const sectionTitle  = $('#sectionTitle');
    const reportOverlay = $('#reportOverlay');
    const reportForm    = $('#reportForm');
    const reportToast   = $('#reportToast');
    const scrollArea    = $('#scrollArea');
    const reportError   = $('#reportError');
    const loadingHint   = $('#loadingHint');

    let currentReportButton = null;
    let toastTimer = null;

    const distanceText = d => d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(1)} km`;

    // ─────────────────────────────────────────────────────────────────────────
    // DATEN LADEN – fetch() gegen die API
    // ─────────────────────────────────────────────────────────────────────────
    async function loadEvents() {
      try {
        const res = await fetch(API_EVENTS_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        // API soll ein Array von Event-Objekten zurückgeben
        events = data;
      } catch (err) {
        console.warn('Events konnten nicht geladen werden:', err);
        events = [];
      }

      // Eigene (lokal erstellte) Events einmischen
      mergeMyEvents();

      // Saved-Status setzen
      events.forEach(e => { e.saved = savedList.some(s => s.id === e.id); });

      if (loadingHint) loadingHint.remove();
      filterAndSort();
    }

    function mergeMyEvents() {
      const myEvents = JSON.parse(localStorage.getItem('visibility-my-events') || '[]');
      myEvents.forEach(me => {
        if (!events.find(e => e.id === me.id)) {
          events.unshift({ ...me, isOwn: true, distance: me.distance || 0, emoji: me.emoji || '⭐' });
        }
      });
    }

    // ─────────────────────────────────────────────────────────────────────────
    // RENDERING
    // ─────────────────────────────────────────────────────────────────────────
    function render(list) {
      eventList.innerHTML = list.map(e => {
        const past = isPast(e.date);
        return `
        <article class="event-row">
          <a class="event-card ${e.isOwn ? 'is-own-event' : ''} ${past ? 'is-past' : ''}" href="event-details.html?id=${e.id}">
            <div class="event-badge"><span>${e.emoji}</span><span>${e.category}</span></div>
            <h3 class="event-title">${e.title}</h3>
            <p class="event-meta">${e.dateText}</p>
            <p class="event-location">${e.location} – ${distanceText(e.distance)}</p>
          </a>
          <div class="event-side">
            <button class="icon-btn save-btn ${e.saved ? 'is-active' : ''}" type="button" data-id="${e.id}"
              aria-label="${e.saved ? 'Event gespeichert' : 'Event speichern'}">
              <svg viewBox="0 0 24 24" fill="${e.saved ? 'currentColor' : 'none'}"
                stroke="currentColor" stroke-width="2.1" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path>
              </svg>
            </button>
            <button class="icon-btn report-btn" type="button" aria-label="Event melden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 21V4"></path>
                <path d="M5 4h10l-1.5 3L17 10H5"></path>
              </svg>
            </button>
          </div>
        </article>`;
      }).join('');

      resultsCount.textContent = `${list.length} Treffer`;
      emptyState.style.display = list.length ? 'none' : 'block';

      $$('.save-btn').forEach(btn => {
        btn.onclick = ev => {
          ev.preventDefault();
          const eventId = btn.getAttribute('data-id');
          const targetEvent = events.find(e => e.id === eventId);
          let currentSavedList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
          btn.classList.toggle('is-active');
          const active = btn.classList.contains('is-active');
          btn.setAttribute('aria-label', active ? 'Event gespeichert' : 'Event speichern');
          btn.querySelector('svg').setAttribute('fill', active ? 'currentColor' : 'none');
          if (active) {
            if (!currentSavedList.some(e => e.id === eventId)) currentSavedList.push(targetEvent);
            targetEvent.saved = true;
            showToast('In Favoriten gespeichert');
          } else {
            currentSavedList = currentSavedList.filter(e => e.id !== eventId);
            targetEvent.saved = false;
            showToast('Aus Favoriten entfernt');
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(currentSavedList));
        };
      });

      $$('.report-btn').forEach(btn => {
        btn.onclick = ev => {
          ev.preventDefault();
          currentReportButton = btn;
          reportForm.reset();
          if (reportError) reportError.style.display = 'none';
          updateReportUI();
          reportOverlay.hidden = false;
        };
      });
    }

    function updateReportUI() {
      $$('.report-option').forEach(option =>
        option.classList.toggle('is-selected', option.querySelector('input').checked)
      );
    }

    function filterAndSort() {
      const q = searchInput.value.trim().toLowerCase();
      const f = filterSelect.value;
      const s = sortSelect.value;

      let list = events.filter(e => {
        const matchSearch = !q || [e.title, e.location, e.category].some(v => v && v.toLowerCase().includes(q));

        let matchFilter = true;
        if (f === 'past') {
          matchFilter = isPast(e.date);
        } else if (f === 'upcoming') {
          matchFilter = !isPast(e.date);
        } else if (f !== 'all') {
          matchFilter = (e.category === f) && !isPast(e.date);
        } else {
          matchFilter = !isPast(e.date);
        }

        return matchSearch && matchFilter;
      });

      list.sort((a, b) =>
        s === 'title' ? a.title.localeCompare(b.title, 'de') :
          s === 'date' ? (a.date || '').localeCompare(b.date || '') :
            (a.distance || 0) - (b.distance || 0)
      );

      sectionTitle.textContent =
        s === 'date' ? 'Events nach Datum:' :
        s === 'title' ? 'Events nach Titel A–Z:' : 'Events nach Entfernung:';
      render(list);
    }

    function showToast(text) {
      reportToast.textContent = text;
      reportToast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => reportToast.hidden = true, 2800);
    }

    [searchInput, sortSelect, filterSelect].forEach(el =>
      el.addEventListener(el === searchInput ? 'input' : 'change', filterAndSort)
    );

    $('#homeBtn').onclick = ev => {
      ev.preventDefault();
      scrollArea.scrollTo({ top: 0, behavior: 'smooth' });
    };

    reportForm.addEventListener('change', updateReportUI);
    $('#closeReportOverlay').onclick = () => reportOverlay.hidden = true;
    reportOverlay.onclick = ev => { if (ev.target === reportOverlay) reportOverlay.hidden = true; };

    reportForm.onsubmit = ev => {
      ev.preventDefault();
      const selectedBoxes = [...reportForm.querySelectorAll('input[name="reportReason"]:checked')];
      if (selectedBoxes.length === 0) { reportError.style.display = 'block'; return; }
      reportError.style.display = 'none';
      const selectedValues = selectedBoxes.map(b => b.value).join(', ');
      if (currentReportButton) {
        currentReportButton.style.opacity = '.3';
        currentReportButton.setAttribute('aria-label', 'Event gemeldet');
      }
      reportOverlay.hidden = true;
      showToast(`Meldung gesendet: ${selectedValues}`);
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('showSuccessPopup') === 'true') {
        const toast = document.getElementById('creationToast');
        toast.hidden = false;
        localStorage.removeItem('showSuccessPopup');
        setTimeout(() => toast.hidden = true, 3000);
      }
    });

    // Starten
    loadEvents();
  </script>

  <script src="app.js"></script>
</body>

</html>
