<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Chat</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .chat-layout { display: flex; flex-direction: column; height: 100%; }

    .chat-partner-info { display: flex; align-items: center; gap: 12px; flex: 1; }

    .chat-partner-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--hover-bg);
      display: grid; place-items: center;
    }
    .chat-partner-avatar svg { width: 20px; height: 20px; color: var(--muted); }

    .chat-partner-details { display: flex; flex-direction: column; text-align: left; }
    .chat-partner-name { font-weight: 800; font-size: 1.05rem; line-height: 1.2; }
    .chat-partner-status { font-size: 0.8rem; color: #22c55e; font-weight: 700; }

    .chat-messages-area {
      flex: 1; overflow-y: auto; padding: 18px;
      display: flex; flex-direction: column; gap: 14px;
      background: var(--surface);
      overscroll-behavior: contain; scrollbar-width: none;
    }
    .chat-messages-area::-webkit-scrollbar { display: none; }

    .message-bubble {
      max-width: 75%; padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.95rem; line-height: 1.4; font-weight: 700;
      word-wrap: break-word; position: relative;
    }
    .message-bubble.incoming {
      background: var(--hover-bg); color: var(--text);
      align-self: flex-start; border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .message-bubble.outgoing {
      background: var(--primary); color: #ffffff;
      align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .message-time {
      font-size: 0.72rem; margin-top: 4px;
      display: block; font-weight: 400; opacity: 0.75;
    }
    .message-bubble.incoming .message-time { color: var(--hint); text-align: left; }
    .message-bubble.outgoing .message-time { color: rgba(255,255,255,0.9); text-align: right; }

    .chat-input-wrap {
      padding: 12px 16px; border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .chat-input-form {
      display: grid; grid-template-columns: 1fr auto;
      gap: 10px; align-items: center;
    }
    .chat-input-field {
      width: 100%; min-height: 48px; padding: 12px 16px;
      border: 1px solid var(--border); border-radius: 24px;
      background: var(--bg); color: var(--text); outline: none; font-size: 0.95rem;
    }
    .chat-input-field:focus { border-color: var(--primary); background: var(--surface); }

    .chat-send-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: var(--primary); color: #ffffff;
      display: grid; place-items: center; cursor: pointer;
      transition: background 0.2s ease;
    }
    .chat-send-btn:hover { background: var(--primary-hover); }
    .chat-send-btn svg { width: 20px; height: 20px; margin-left: 2px; }
  </style>
</head>

<body>
  <script>
    // Systemweiter Darkmode-Check beim Laden ausführen
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <!-- Haupt-Smartphone-Frame -->
  <main class="phone">
    
    <!-- Sticky Chat Header -->
    <div class="header-wrap">
      <header class="header has-back" style="display: flex; justify-content: flex-start; align-items: center; gap: 12px;">
        <a class="back-btn" href="home.html" aria-label="Zurück">&#8249;</a>
        
        <!-- Chat-Partner Infos dynamisch oder fest im Frame -->
        <div class="chat-partner-info">
          <div class="chat-partner-avatar">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/>
            </svg>
          </div>
          <div class="chat-partner-details">
            <span class="chat-partner-name" id="chatPartnerName">Tina M.</span>
            <span class="chat-partner-status">online</span>
          </div>
        </div>
      </header>
    </div>

    <!-- Nachrichtenverlauf (Scrollbar) -->
    <div class="chat-messages-area" id="chatMessages">
      
      <!-- Empfangene Nachricht -->
      <div class="message-bubble incoming">
        Hey! Hast du morgen Zeit für den Hundespaziergang an der Nordseepassage? 🐾
        <span class="message-time">23:42</span>
      </div>

      <!-- Gesendete Nachricht -->
      <div class="message-bubble outgoing">
        Hi Tina! Ja, voll gerne! Um wie viel Uhr wolltest du losgehen? 😄
        <span class="message-time">23:44</span>
      </div>

      <!-- Empfangene Nachricht -->
      <div class="message-bubble incoming">
        Dachte so gegen 15:00 Uhr, wenn das Wetter hält. Passt dir das?
        <span class="message-time">23:45</span>
      </div>

    </div>

    <!-- Chat Eingabefeld unten (Über der Bottom-Nav platziert) -->
    <div class="chat-input-wrap">
      <form id="chatInputForm" class="chat-input-form" novalidate>
        <input type="text" id="messageInputField" class="chat-input-field" placeholder="Nachricht schreiben..." autocomplete="off" required>
        <button type="submit" class="chat-send-btn" aria-label="Nachricht senden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a class="nav-btn" href="home.html" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"></path></svg>
      </a>
      <a class="nav-btn is-active" href="chat.html" aria-label="Chat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>
      </a>
      <a class="nav-btn is-primary" href="meeting-form.html" aria-label="Treffen erstellen">+</a>
      <a class="nav-btn" href="saved.html" aria-label="Gespeicherte Inhalte"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg></a>
      <a class="nav-btn" href="profile.html" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"></path></svg>
      </a>
    </nav>
  </main>

  <!-- DEV-Navigation (wird auf Mobile automatisch ausgeblendet, wie im Reset definiert) -->
    <script src="app.js"></script>
</body>

</html>
