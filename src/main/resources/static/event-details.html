<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Event Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>
  <main class="phone">
    <header class="header has-back">
      <a class="back-btn" href="home.html" aria-label="Zurück">&#8249;</a>
      <div class="brand"><span id="eventTitleHeader">Event</span></div>
    </header>
    <div class="scroll-area">
      <section class="content" id="eventContent">
        <p style="color:var(--muted);">Wird geladen…</p>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const user = JSON.parse(localStorage.getItem('tv-user') || 'null');

    async function loadEvent() {
      if (!id) { document.getElementById('eventContent').innerHTML = '<p>Event nicht gefunden.</p>'; return; }
      try {
        const res = await fetch(`/api/meetings/${id}`);
        if (!res.ok) { document.getElementById('eventContent').innerHTML = '<p>Event nicht gefunden.</p>'; return; }
        const e = await res.json();
        document.getElementById('eventTitleHeader').textContent = e.title || 'Event';
        const isOwn = user && e.creatorId === user.id;
        const dateStr = e.dateTime ? new Date(e.dateTime).toLocaleDateString('de-DE', {weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Kein Datum';
        document.getElementById('eventContent').innerHTML = `
          <div style="margin-bottom:20px;">
            <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px;">${e.title}</h2>
            <p style="color:var(--muted);font-size:0.9rem;margin-bottom:4px;">📅 ${dateStr}</p>
            <p style="color:var(--muted);font-size:0.9rem;margin-bottom:16px;">📍 ${e.locationName || 'Kein Ort angegeben'}</p>
            ${e.description ? `<p style="line-height:1.6;">${e.description}</p>` : ''}
          </div>
          ${isOwn ? `
          <div style="display:flex;gap:10px;margin-top:20px;">
            <button onclick="deleteEvent()" style="flex:1;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:var(--radius-md);font-weight:800;cursor:pointer;">Event löschen</button>
          </div>` : `
          <div style="margin-top:20px;">
            <button onclick="startChat(${e.creatorId})" class="submit-btn">Veranstalter anschreiben</button>
          </div>`}`;
      } catch(e) {
        document.getElementById('eventContent').innerHTML = '<p>Fehler beim Laden.</p>';
      }
    }

    async function deleteEvent() {
      if (!confirm('Event wirklich löschen?')) return;
      await fetch(`/api/meetings/${id}`, { method: 'DELETE' });
      window.location.href = 'home.html';
    }

    function startChat(creatorId) {
      localStorage.setItem('chat-open-recipient', creatorId);
      window.location.href = 'chat.html';
    }

    loadEvent();
  </script>
</body>
</html>
