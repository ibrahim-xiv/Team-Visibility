<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visibility – Event Details</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .ride-section{margin-top:24px;padding:16px;background:var(--hover-bg);border-radius:var(--radius-md);border:1px solid var(--border);}
    .ride-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.88rem;}
    .ride-item:last-child{border-bottom:none;}
    .ride-btn{padding:6px 12px;border-radius:20px;border:none;font-size:0.8rem;font-weight:700;cursor:pointer;}
    .ride-offer{background:#22c55e;color:#fff;}
    .ride-request{background:var(--primary);color:#fff;}
    .edit-form{margin-top:16px;}
    .edit-form .form-group{margin-bottom:12px;}
    .edit-form label{font-weight:700;font-size:0.85rem;display:block;margin-bottom:4px;}
    .edit-form input,.edit-form textarea,.edit-form select{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:0.9rem;box-sizing:border-box;}
  </style>
</head>
<body>
<script>if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');</script>
<main class="phone">
  <header class="header has-back">
    <a class="back-btn" href="home.html">&#8249;</a>
    <div class="brand"><span id="eventTitleHeader">Event</span></div>
  </header>
  <div class="scroll-area">
    <section class="content" id="eventContent"><p style="color:var(--muted);">Wird geladen…</p></section>
  </div>
</main>
<script src="app.js"></script>
<script>
const params=new URLSearchParams(window.location.search);
const id=params.get('id');
const user=JSON.parse(localStorage.getItem('tv-user')||'null');
let eventData=null,editing=false;

async function loadEvent(){
  if(!id){document.getElementById('eventContent').innerHTML='<p>Event nicht gefunden.</p>';return;}
  try{
    const r=await fetch('/api/meetings/'+id);
    if(!r.ok){document.getElementById('eventContent').innerHTML='<p>Event nicht gefunden.</p>';return;}
    eventData=await r.json();
    document.getElementById('eventTitleHeader').textContent=eventData.title||'Event';
    renderEvent();
    loadRides();
  }catch(e){document.getElementById('eventContent').innerHTML='<p>Fehler beim Laden.</p>';}
}

function renderEvent(){
  const e=eventData,isOwn=user&&e.creatorId===user.id;
  const dateStr=e.dateTime?new Date(e.dateTime).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Kein Datum';
  let html=`<div style="margin-bottom:20px;">
    <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px;">${e.title}</h2>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:4px;">📅 ${dateStr}</p>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:4px;">📍 ${e.locationName||'Kein Ort'}</p>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:16px;">📂 ${e.category||'Allgemein'}</p>
    ${e.description?`<p style="line-height:1.6;">${e.description}</p>`:''}
  </div>`;

  if(isOwn){
    html+=`<div style="display:flex;gap:10px;margin-bottom:16px;">
      <button onclick="toggleEdit()" class="submit-btn" style="flex:1;background:var(--hover-bg);color:var(--text);border:1px solid var(--border);">✏️ Bearbeiten</button>
      <button onclick="deleteEvent()" style="flex:1;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:var(--radius-md);font-weight:800;cursor:pointer;">🗑️ Löschen</button>
    </div>
    <button onclick="openGroupChat()" class="submit-btn" style="width:100%;margin-bottom:16px;background:#7c3aed;color:#fff;border:none;">👥 Gruppen-Chat öffnen</button>
    <div id="editSection"></div>`;
  } else {
    html+=`<div style="display:flex;gap:10px;margin-bottom:16px;">
      <button onclick="startChat(${e.creatorId})" class="submit-btn" style="flex:1;">💬 Veranstalter anschreiben</button>
      <a href="profile-view.html?id=${e.creatorId}" class="submit-btn" style="flex:1;text-align:center;text-decoration:none;background:var(--hover-bg);color:var(--text);border:1px solid var(--border);">👤 Profil ansehen</a>
    </div>
    <button onclick="openGroupChat()" class="submit-btn" style="width:100%;margin-bottom:16px;background:#7c3aed;color:#fff;border:none;">👥 Event Gruppen-Chat</button>`;
  }

  html+=`<div class="ride-section">
    <h3 style="margin:0 0 12px;font-size:1rem;font-weight:800;">🚗 Mitfahrgelegenheiten</h3>
    <div id="rideList"><p style="color:var(--muted);font-size:0.85rem;">Wird geladen…</p></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button onclick="showOfferModal()" class="ride-btn ride-offer">🚗 Fahrt anbieten</button>
      <button onclick="showRequestModal()" class="ride-btn ride-request">🙋 Mitfahrt anfragen</button>
    </div>
  </div>
  <!-- Offer Ride Modal -->
  <div id="offerModal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;justify-content:center;">
    <div style="background:var(--surface);border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:480px;box-sizing:border-box;">
      <h3 style="margin:0 0 16px;font-size:1.1rem;font-weight:800;">🚗 Fahrt anbieten</h3>
      <div class="form-group" style="margin-bottom:12px;">
        <label style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:4px;">Treffpunkt / Abholort <span style="color:#ef4444;">*</span></label>
        <input id="offerPickup" class="input" type="text" placeholder="z.B. Hauptbahnhof Hannover">
      </div>
      <div class="form-group" style="margin-bottom:12px;">
        <label style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:4px;">Abfahrtzeit <span style="color:#ef4444;">*</span></label>
        <input id="offerTime" class="input" type="time">
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:4px;">Freie Plätze <span style="color:#ef4444;">*</span></label>
        <select id="offerSeats" class="input">
          <option value="1">1 Platz</option>
          <option value="2" selected>2 Plätze</option>
          <option value="3">3 Plätze</option>
          <option value="4">4 Plätze</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="closeModals()" style="flex:1;padding:12px;background:var(--hover-bg);border:1px solid var(--border);border-radius:var(--radius-md);font-weight:700;cursor:pointer;color:var(--text);">Abbrechen</button>
        <button onclick="submitOffer()" style="flex:1;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;cursor:pointer;">Anbieten</button>
      </div>
    </div>
  </div>
  <!-- Request Ride Modal -->
  <div id="requestModal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;justify-content:center;">
    <div style="background:var(--surface);border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:480px;box-sizing:border-box;">
      <h3 style="margin:0 0 16px;font-size:1.1rem;font-weight:800;">🙋 Mitfahrt anfragen</h3>
      <div class="form-group" style="margin-bottom:12px;">
        <label style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:4px;">Einstiegspunkt (optional)</label>
        <input id="reqPickup" class="input" type="text" placeholder="z.B. Stadtmitte, Haltestelle X">
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:4px;">Nachricht (optional)</label>
        <textarea id="reqNote" class="input" rows="3" placeholder="Kurze Info für den Fahrer…" style="resize:vertical;"></textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="closeModals()" style="flex:1;padding:12px;background:var(--hover-bg);border:1px solid var(--border);border-radius:var(--radius-md);font-weight:700;cursor:pointer;color:var(--text);">Abbrechen</button>
        <button onclick="submitRequest()" style="flex:1;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;cursor:pointer;">Anfragen</button>
      </div>
    </div>
  </div>`;

  document.getElementById('eventContent').innerHTML=html;
}

function toggleEdit(){
  const sec=document.getElementById('editSection');
  if(editing){sec.innerHTML='';editing=false;return;}
  editing=true;
  const e=eventData;
  sec.innerHTML=`<div class="edit-form">
    <div class="form-group"><label>Titel</label><input id="editTitle" value="${e.title||''}"></div>
    <div class="form-group"><label>Ort</label><input id="editLocation" value="${e.locationName||''}"></div>
    <div class="form-group"><label>Datum</label><input id="editDate" type="datetime-local" value="${e.dateTime?e.dateTime.slice(0,16):''}"></div>
    <div class="form-group"><label>Kategorie</label><select id="editCategory">
      ${['Freizeit','Sport','Spieleabend','Kultur','Community','Anderes…'].map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Beschreibung</label><textarea id="editDesc" rows="3">${e.description||''}</textarea></div>
    <button onclick="saveEdit()" class="submit-btn">Speichern</button>
  </div>`;
}

async function saveEdit(){
  try{
    const r=await fetch('/api/meetings/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      title:document.getElementById('editTitle').value.trim(),
      locationName:document.getElementById('editLocation').value.trim(),
      dateTime:document.getElementById('editDate').value||null,
      category:document.getElementById('editCategory').value,
      description:document.getElementById('editDesc').value.trim()
    })});
    if(!r.ok){const d=await r.json();alert(d.error||'Fehler');return;}
    eventData=await r.json();editing=false;renderEvent();loadRides();
  }catch(e){alert('Fehler beim Speichern.');}
}

async function deleteEvent(){
  if(!confirm('Event wirklich löschen?'))return;
  await fetch('/api/meetings/'+id,{method:'DELETE'});
  window.location.href='home.html';
}

async function loadRides(){
  try{
    const r=await fetch('/api/rides/'+id);const rides=await r.json();
    const el=document.getElementById('rideList');
    if(!rides.length){el.innerHTML='<p style="color:var(--muted);font-size:0.85rem;">Noch keine Mitfahrten.</p>';return;}
    el.innerHTML=rides.map(rd=>{
      const isOffer=rd.type==='OFFER';
      const canMatch=rd.status==='OPEN'&&((isOffer&&rd.offererId!==user?.id)||(!isOffer&&rd.requesterId!==user?.id));
      return`<div class="ride-item">
        <span>${isOffer?'🚗 Bietet Fahrt an':'🙋 Sucht Mitfahrt'}${rd.pickup?' – '+rd.pickup:''}${rd.seats?' ('+rd.seats+' Plätze)':''} <span style="color:var(--muted);font-size:0.75rem;">[${rd.status}]</span></span>
        ${canMatch?`<button onclick="matchRide(${rd.id})" class="ride-btn ${isOffer?'ride-request':'ride-offer'}">${isOffer?'Mitfahren':'Anbieten'}</button>`:''}
      </div>`;
    }).join('');
  }catch(e){}
}

function closeModals(){
  document.getElementById('offerModal').style.display='none';
  document.getElementById('requestModal').style.display='none';
}
function showOfferModal(){
  document.getElementById('offerModal').style.display='flex';
}
function showRequestModal(){
  document.getElementById('requestModal').style.display='flex';
}
async function submitOffer(){
  const pickup=document.getElementById('offerPickup').value.trim();
  const time=document.getElementById('offerTime').value;
  const seats=Number(document.getElementById('offerSeats').value);
  if(!pickup){alert('Bitte Treffpunkt eingeben.');return;}
  if(!time){alert('Bitte Abfahrtszeit eingeben.');return;}
  await fetch('/api/rides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meetingId:Number(id),type:'OFFER',pickup:pickup+(time?' um '+time:''),seats})});
  closeModals();loadRides();
}
async function submitRequest(){
  const pickup=document.getElementById('reqPickup').value.trim();
  const note=document.getElementById('reqNote').value.trim();
  await fetch('/api/rides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meetingId:Number(id),type:'REQUEST',pickup:pickup||'',note:note||''})});
  closeModals();loadRides();
}
async function offerRide(){ showOfferModal(); }
async function requestRide(){ showRequestModal(); }
async function matchRide(rideId){
  await fetch('/api/rides/'+rideId+'/match',{method:'PUT'});
  loadRides();
}
function startChat(creatorId){
  localStorage.setItem('chat-open-recipient',creatorId);
  window.location.href='chat.html';
}
function openGroupChat(){
  localStorage.setItem('chat-open-group', id);
  localStorage.setItem('chat-open-group-name', eventData?.title||'Event Chat');
  window.location.href='chat.html';
}

loadEvent();
</script>
</body></html>
