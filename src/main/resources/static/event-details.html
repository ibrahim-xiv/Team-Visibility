<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visibility – Event Details</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .ride-section{margin-top:24px;padding:16px;background:var(--hover-bg);border-radius:var(--radius-md);border:1px solid var(--border);}
    .ride-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.88rem;}
    .ride-item:last-child{border-bottom:none;}
    .ride-btn{padding:6px 12px;border-radius:20px;border:none;font-size:0.8rem;font-weight:700;cursor:pointer;}
    .ride-offer{background:#22c55e;color:#fff;}.ride-request{background:var(--primary);color:#fff;}
    .ride-form{margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);display:none;}
    .ride-form label{font-weight:700;font-size:0.82rem;display:block;margin:8px 0 4px;}
    .ride-form input,.ride-form textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:0.88rem;box-sizing:border-box;}
    .ride-form-actions{display:flex;gap:8px;margin-top:12px;}
    .edit-form{margin-top:16px;}.edit-form .form-group{margin-bottom:12px;}
    .edit-form label{font-weight:700;font-size:0.85rem;display:block;margin-bottom:4px;}
    .edit-form input,.edit-form textarea,.edit-form select{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:0.9rem;box-sizing:border-box;}
  </style>
</head>
<body>
<script>if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');</script>
<main class="phone">
  <header class="header has-back"><a class="back-btn" href="home.html">&#8249;</a><div class="brand"><span id="eventTitleHeader">Event</span></div></header>
  <div class="scroll-area"><section class="content" id="eventContent"><p style="color:var(--muted);">Wird geladen…</p></section></div>
</main>
<script src="app.js"></script>
<script>
const params=new URLSearchParams(window.location.search),id=params.get('id');
const user=JSON.parse(localStorage.getItem('tv-user')||'null');
let eventData=null,editing=false;

async function loadEvent(){
  if(!id){document.getElementById('eventContent').innerHTML='<p>Event nicht gefunden.</p>';return;}
  try{const r=await fetch('/api/meetings/'+id);if(!r.ok){document.getElementById('eventContent').innerHTML='<p>Event nicht gefunden.</p>';return;}
    eventData=await r.json();document.getElementById('eventTitleHeader').textContent=eventData.title||'Event';renderEvent();loadRides();
  }catch(e){document.getElementById('eventContent').innerHTML='<p>Fehler.</p>';}
}

function renderEvent(){
  const e=eventData,isOwn=user&&e.creatorId===user.id;
  const dateStr=e.dateTime?new Date(e.dateTime).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Kein Datum';
  let h=`<div style="margin-bottom:20px;">
    <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px;">${e.title}</h2>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:4px;">📅 ${dateStr}</p>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:4px;">📍 ${e.locationName||'Kein Ort'}</p>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:16px;">📂 ${e.category||'Allgemein'}</p>
    ${e.description?`<p style="line-height:1.6;">${e.description}</p>`:''}
  </div>`;

  // Action buttons
  if(isOwn){
    h+=`<div style="display:flex;gap:10px;margin-bottom:16px;">
      <button onclick="toggleEdit()" class="submit-btn" style="flex:1;background:var(--hover-bg);color:var(--text);border:1px solid var(--border);">✏️ Bearbeiten</button>
      <button onclick="deleteEvent()" style="flex:1;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:var(--radius-md);font-weight:800;cursor:pointer;">🗑️ Löschen</button>
    </div><div id="editSection"></div>`;
  } else {
    h+=`<div style="display:flex;gap:10px;margin-bottom:16px;">
      <button onclick="startPrivateChat(${e.creatorId})" class="submit-btn" style="flex:1;">💬 Veranstalter</button>
      <a href="profile-view.html?id=${e.creatorId}" class="submit-btn" style="flex:1;text-align:center;text-decoration:none;background:var(--hover-bg);color:var(--text);border:1px solid var(--border);">👤 Profil</a>
    </div>`;
  }

  // Group chat button
  h+=`<button onclick="openGroupChat()" class="submit-btn" style="width:100%;margin-bottom:16px;background:var(--hover-bg);color:var(--text);border:1px solid var(--border);">💬 Gruppen-Chat zu diesem Event</button>`;

  // Rides section
  h+=`<div class="ride-section">
    <h3 style="margin:0 0 12px;font-size:1rem;font-weight:800;">🚗 Mitfahrgelegenheiten</h3>
    <div id="rideList"><p style="color:var(--muted);font-size:0.85rem;">Wird geladen…</p></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button onclick="showRideForm('OFFER')" class="ride-btn ride-offer">🚗 Fahrt anbieten</button>
      <button onclick="showRideForm('REQUEST')" class="ride-btn ride-request">🙋 Mitfahrt anfragen</button>
    </div>
    <div class="ride-form" id="rideForm">
      <input type="hidden" id="rideType">
      <h4 id="rideFormTitle" style="margin:0 0 8px;font-size:0.95rem;font-weight:800;"></h4>
      <label>Treffpunkt / Abholort</label><input id="ridePickup" placeholder="z.B. Bahnhof Wilhelmshaven">
      <label>Freie Plätze</label><input id="rideSeats" type="number" min="1" max="8" value="2">
      <label>Uhrzeit</label><input id="rideTime" type="time">
      <label>Nachricht (optional)</label><textarea id="rideNote" rows="2" placeholder="Weitere Infos…"></textarea>
      <div class="ride-form-actions">
        <button onclick="submitRide()" class="submit-btn" style="flex:1;">Absenden</button>
        <button onclick="document.getElementById('rideForm').style.display='none'" style="flex:1;padding:10px;background:var(--hover-bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;font-weight:700;">Abbrechen</button>
      </div>
    </div>
  </div>`;

  document.getElementById('eventContent').innerHTML=h;
}

function showRideForm(type){
  document.getElementById('rideType').value=type;
  document.getElementById('rideFormTitle').textContent=type==='OFFER'?'🚗 Fahrt anbieten':'🙋 Mitfahrt anfragen';
  document.getElementById('rideForm').style.display='block';
  document.getElementById('ridePickup').value='';
  document.getElementById('rideSeats').value='2';
  document.getElementById('rideTime').value='';
  document.getElementById('rideNote').value='';
}

async function submitRide(){
  const type=document.getElementById('rideType').value;
  const pickup=document.getElementById('ridePickup').value.trim();
  if(!pickup){alert('Bitte Treffpunkt angeben.');return;}
  const time=document.getElementById('rideTime').value;
  const body={meetingId:Number(id),type,pickup:pickup+(time?' um '+time:''),seats:Number(document.getElementById('rideSeats').value)||2,note:document.getElementById('rideNote').value.trim()};
  await fetch('/api/rides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  document.getElementById('rideForm').style.display='none';
  loadRides();
}

function toggleEdit(){
  const sec=document.getElementById('editSection');if(editing){sec.innerHTML='';editing=false;return;}editing=true;
  const e=eventData;
  sec.innerHTML=`<div class="edit-form">
    <div class="form-group"><label>Titel</label><input id="editTitle" value="${e.title||''}"></div>
    <div class="form-group"><label>Ort</label><input id="editLocation" value="${e.locationName||''}"></div>
    <div class="form-group"><label>Datum</label><input id="editDate" type="datetime-local" value="${e.dateTime?e.dateTime.slice(0,16):''}"></div>
    <div class="form-group"><label>Kategorie</label><select id="editCategory">${['Freizeit','Sport','Spieleabend','Kultur','Community','Anderes…'].map(c=>'<option'+(c===e.category?' selected':'')+'>'+c+'</option>').join('')}</select></div>
    <div class="form-group"><label>Beschreibung</label><textarea id="editDesc" rows="3">${e.description||''}</textarea></div>
    <button onclick="saveEdit()" class="submit-btn">Speichern</button></div>`;
}

async function saveEdit(){
  const r=await fetch('/api/meetings/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('editTitle').value.trim(),locationName:document.getElementById('editLocation').value.trim(),dateTime:document.getElementById('editDate').value||null,category:document.getElementById('editCategory').value,description:document.getElementById('editDesc').value.trim()})});
  if(!r.ok){const d=await r.json();alert(d.error||'Fehler');return;}eventData=await r.json();editing=false;renderEvent();loadRides();
}

async function deleteEvent(){if(!confirm('Event wirklich löschen?'))return;await fetch('/api/meetings/'+id,{method:'DELETE'});window.location.href='home.html';}

async function loadRides(){
  try{const r=await fetch('/api/rides/'+id);const rides=await r.json();const el=document.getElementById('rideList');
    if(!rides.length){el.innerHTML='<p style="color:var(--muted);font-size:0.85rem;">Noch keine Mitfahrten.</p>';return;}
    el.innerHTML=rides.map(rd=>{
      const isOffer=rd.type==='OFFER',canMatch=rd.status==='OPEN'&&((isOffer&&rd.offererId!==user?.id)||(!isOffer&&rd.requesterId!==user?.id));
      return`<div class="ride-item"><span>${isOffer?'🚗 Bietet Fahrt':'🙋 Sucht Mitfahrt'}${rd.pickup?' – '+rd.pickup:''}${rd.seats?' ('+rd.seats+' Plätze)':''} <span style="color:var(--muted);font-size:0.75rem;">[${rd.status}]</span></span>
        ${canMatch?`<button onclick="matchRide(${rd.id})" class="ride-btn ${isOffer?'ride-request':'ride-offer'}">${isOffer?'Mitfahren':'Anbieten'}</button>`:''}</div>`;
    }).join('');
  }catch(e){}
}

async function matchRide(rideId){await fetch('/api/rides/'+rideId+'/match',{method:'PUT'});loadRides();}
function startPrivateChat(uid){localStorage.setItem('chat-open-recipient',uid);window.location.href='chat.html';}
function openGroupChat(){localStorage.setItem('chat-open-group',JSON.stringify({id:'event-'+id,name:eventData.title}));window.location.href='chat.html';}

loadEvent();
</script>
</body></html>
