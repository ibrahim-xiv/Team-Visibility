<body>
  
  <script>
  // Prüfen, ob Darkmode in den Settings aktiviert wurde
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>
  <main class="phone">
    
    <header class="header has-back">
      <a class="back-btn" href="profile.html" aria-label="Zurück">&#8249;</a>

    </header>

    <div class="scroll-area">
      <section class="content">
        
        <div class="settings-row">
          <span><strong>Dunkelmodus</strong></span>
          <label class="switch">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider"></span>

        <div class="logout-section">

      </section>

    <nav class="bottom-nav">
      <a class="nav-btn" href="home.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg></a>
      <a class="nav-btn" href="chat.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></a>
      <a class="nav-btn is-primary" href="meeting-form.html">+</a>
      <a class="nav-btn" href="saved.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg></a>
      <a class="nav-btn is-active" href="profile.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg></a>
    </nav>
  </main>

  <div class="overlay" id="logoutOverlay" hidden>
    <div class="overlay-card is-narrow">
      <h2>Abmelden?</h2>
      <p>Möchtest du dich wirklich ausloggen?</p>
      <div class="overlay-actions">
        <button class="overlay-close" id="cancelLogout">Abbrechen</button>
        <button class="overlay-submit" id="confirmLogout">Ja, Abmelden</button>
      </div>
    </div>
  </div>

 <script>
  // ── ELEMENTE FINDEN ──
  const toggle = document.getElementById('darkModeToggle');
  const logoutBtn = document.getElementById('logoutBtn');
  const logoutOverlay = document.getElementById('logoutOverlay');
  const devThemeBtn = document.getElementById('devThemeToggle');
  const devNav = document.querySelector('.dev-nav');
  const devHeader = document.querySelector('.dev-nav-header');

  // ── 1. DARKMODE FUNKTION ──
  function updateTheme(isDark) {
    if (isDark) {
      document.body.classList.add('dark-mode');
      localStorage.setItem('theme', 'dark');
    } else {
      document.body.classList.remove('dark-mode');
      localStorage.setItem('theme', 'light');
    }
    // Beide Schalter synchronisieren
    if (toggle) toggle.checked = isDark;
  }

  // Initialer Check beim Laden
  const currentIsDark = localStorage.getItem('theme') === 'dark';
  updateTheme(currentIsDark);

  // Event für den normalen Toggle-Switch
  if (toggle) {
    toggle.onchange = () => updateTheme(toggle.checked);
  }

  // Event für den DEV-Modus Schalter
  if (devThemeBtn) {
    devThemeBtn.addEventListener('click', () => {
      const isNowDark = !document.body.classList.contains('dark-mode');
      updateTheme(isNowDark);
    });
  }

  // ── 2. LOGOUT LOGIK ──
  if (logoutBtn) {
    logoutBtn.onclick = () => logoutOverlay.hidden = false;
  }
  if (document.getElementById('cancelLogout')) {
    document.getElementById('cancelLogout').onclick = () => logoutOverlay.hidden = true;
  }
  if (document.getElementById('confirmLogout')) {
    document.getElementById('confirmLogout').onclick = () => {
      localStorage.removeItem('visibility-profile');
      window.location.href = 'login.html';
    };
  }

  // ── 3. DEV-NAV COLLAPSE LOGIK ──
  if (devNav && devHeader) {
    if (localStorage.getItem('devNavCollapsed') === 'true') {
      devNav.classList.add('collapsed');
    }

    devHeader.addEventListener('click', () => {
      const isNowCollapsed = devNav.classList.toggle('collapsed');
      localStorage.setItem('devNavCollapsed', isNowCollapsed);
    });
  }
</script>
<!-- DEV Navigation - Nur für Entwickler sichtbar, um schnell zwischen Seiten zu wechseln -->
  <nav class="dev-nav">
    <div class="dev-nav-header">DEV-Navigation</div>
    <div><a href="login.html" class="dev-btn">🔑 Login</a></div>

    <div><a href="profile.html" class="dev-btn">👤 Eigenes Profil</a></div>
    <div><a href="profile-view.html" class="dev-btn">👁️ Fremdes Profil</a></div>
    <div><a href="profile-edit.html" class="dev-btn">✏️ Profil bearbeiten</a></div>
    <div><a href="settings.html" class="dev-btn">⚙️ Einstellungen</a></div>
    <div><a href="map.html" class="dev-btn">🗺️ Kartenansicht</a></div>
    <div><a href="event-details.html" class="dev-btn">📝 Event Details</a></div>
    <div><a href="saved.html" class="dev-btn">📅 Events</a></div>
    <div><a href="chat.html" class="dev-btn">💬 Chat</a></div>
    <div style="margin-top: 5px; padding-top: 10px; border-top: 1px solid #363434;">
      <button id="devThemeToggle" class="dev-btn-action">🌗 Modus wechseln</button>
    </div>
  </nav>
  <script>
    // Logik für den Dev-Darkmode-Schalter
    const devThemeBtn = document.getElementById('devThemeToggle');
    if (devThemeBtn) {
      devThemeBtn.addEventListener('click', () => {
        // Body-Klasse umschalten
        const isDark = document.body.classList.toggle('dark-mode');
        
        // In den Speicher schreiben, damit es auf der nächsten Seite bleibt
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        
        // Sync mit dem Schalter auf der settings.html (falls man dort ist)
        const settingsToggle = document.getElementById('darkModeToggle');
        if(settingsToggle) settingsToggle.checked = isDark;

        // Spezial-Fix: Wenn man auf der Karte ist, kurz neu laden, 
        // damit die echten schwarzen Karten-Bilder (Tiles) von CartoDB geladen werden
        if(window.location.pathname.includes('map.html')) {
            window.location.reload();
        }
      });
    }
    // ── DEV-NAV COLLAPSE LOGIK (Zusammenfalten) ──
const devNav = document.querySelector('.dev-nav');
const devHeader = document.querySelector('.dev-nav-header');

if (devNav && devHeader) {
    // 1. Prüfen, ob die Nav beim Laden schon eingeklappt sein soll (aus dem Speicher)
    if (localStorage.getItem('devNavCollapsed') === 'true') {
        devNav.classList.add('collapsed');
    }

    // 2. Klick-Event: Wenn man auf "DEV-Navigation" drückt
    devHeader.addEventListener('click', () => {
        // Umschalten der CSS-Klasse .collapsed
        const isNowCollapsed = devNav.classList.toggle('collapsed');
        
        // Zustand im Browser speichern, damit er beim Seitenwechsel bleibt
        localStorage.setItem('devNavCollapsed', isNowCollapsed);
    });
}
  </script>

</body>
