  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Spezifisch für Einstellungen */
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
    }

    /* Der Switch (Toggle) */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: var(--muted);
      transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 4px; bottom: 4px; background-color: #fff;
      transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    .logout-section { margin-top: 40px; }
  </style>
</head>
<body>
  <script>
  // Prüfen, ob Darkmode in den Settings aktiviert wurde
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>
  <main class="phone">
    
    <header class="header has-back">
      <a class="back-btn" href="profile.html" aria-label="Zurück">&#8249;</a>
      <h1>Einstellungen</h1>
    </header>

    <div class="scroll-area">
      <section class="content">
        
        <div class="settings-row">
          <span><strong>Dunkelmodus</strong></span>
          <label class="switch">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider"></span>
          </label>
        </div>

        <div class="logout-section">
          <button class="danger-btn" id="logoutBtn">Abmelden</button>
        </div>

      </section>
    </div>

    <nav class="bottom-nav">
      <a class="nav-btn" href="home.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg></a>
      <a class="nav-btn" href="chat.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></a>
      <a class="nav-btn is-primary" href="meeting-form.html">+</a>
      <a class="nav-btn" href="saved.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg></a>
      <a class="nav-btn is-active" href="profile.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg></a>
    </nav>
  </main>

  <div class="overlay" id="logoutOverlay" hidden>
    <div class="overlay-card is-narrow">
      <h2>Abmelden?</h2>
      <p>Möchtest du dich wirklich ausloggen?</p>
      <div class="overlay-actions">
        <button class="overlay-close" id="cancelLogout">Abbrechen</button>
        <button class="overlay-submit" id="confirmLogout">Ja, Abmelden</button>
      </div>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('darkModeToggle');
    const logoutBtn = document.getElementById('logoutBtn');
    const logoutOverlay = document.getElementById('logoutOverlay');

    // 1. Darkmode Logik
    const isDark = localStorage.getItem('theme') === 'dark';
    toggle.checked = isDark;
    if(isDark) document.body.classList.add('dark-mode');

    toggle.onchange = () => {
      if(toggle.checked) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      }
    };

    // 2. Logout Logik
    logoutBtn.onclick = () => logoutOverlay.hidden = false;
    document.getElementById('cancelLogout').onclick = () => logoutOverlay.hidden = true;
    document.getElementById('confirmLogout').onclick = () => {
      localStorage.removeItem('visibility-profile'); // Daten löschen (optional)
      window.location.href = 'login.html';
    };
  </script>

    <button id="devThemeToggle" class="dev-btn-action">
      🌗 Modus wechseln
    </button>

  <script>
    // Logik für den Dev-Darkmode-Schalter
    const devThemeBtn = document.getElementById('devThemeToggle');
    if (devThemeBtn) {
      devThemeBtn.addEventListener('click', () => {
        // Body-Klasse umschalten
        const isDark = document.body.classList.toggle('dark-mode');
        
        // In den Speicher schreiben, damit es auf der nächsten Seite bleibt
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        
        // Sync mit dem Schalter auf der settings.html (falls man dort ist)
        const settingsToggle = document.getElementById('darkModeToggle');
        if(settingsToggle) settingsToggle.checked = isDark;

        // Spezial-Fix: Wenn man auf der Karte ist, kurz neu laden, 
        // damit die echten schwarzen Karten-Bilder (Tiles) von CartoDB geladen werden
        if(window.location.pathname.includes('map.html')) {
            window.location.reload();
        }
      });
    }
  </script>
