<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Profil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    const user = JSON.parse(localStorage.getItem('tv-user') || 'null');
    if (!user) window.location.href = 'login.html';
  </script>

  <main class="phone">
    <header class="header">
      <div class="brand"><span>Profil</span></div>
      <a href="settings.html" class="header-icon-btn" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </header>

    <div class="scroll-area">
      <section class="content">
        <div class="profile-card">
          <div class="profile-avatar-wrap">
            <div class="profile-avatar">
              <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
                <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/>
              </svg>
            </div>
          </div>
          <h2 class="profile-name" id="profileName">…</h2>
          <p class="profile-username" id="profileUsername"></p>
          <p class="profile-email" id="profileEmail" style="color:var(--muted);font-size:0.85rem;margin-top:4px;"></p>
        </div>

        <div style="margin-top:20px;">
          <h3 style="font-size:1rem;font-weight:800;margin-bottom:12px;">Meine Events</h3>
          <div id="myEvents">
            <p style="color:var(--muted);font-size:0.9rem;">Wird geladen…</p>
          </div>
        </div>

        <div style="margin-top:24px;display:flex;flex-direction:column;gap:10px;">
          <a href="profile-edit.html" class="submit-btn" style="text-align:center;text-decoration:none;display:block;">Profil bearbeiten</a>
          <button onclick="logout()" class="submit-btn" style="background:var(--hover-bg);color:var(--text);border:1px solid var(--border);">Abmelden</button>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a class="nav-btn" href="home.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"></path></svg></a>
      <a class="nav-btn" href="chat.html" aria-label="Chat"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg></a>
      <a class="nav-btn is-primary" href="meeting-form.html" aria-label="Erstellen">+</a>
      <a class="nav-btn" href="saved.html" aria-label="Gespeichert"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg></a>
      <a class="nav-btn is-active" href="profile.html" aria-label="Profil"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"></path></svg></a>
    </nav>
  </main>

  <script src="app.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('tv-user') || 'null');

    async function loadProfile() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.status === 401) { window.location.href = 'login.html'; return; }
        const u = await res.json();
        localStorage.setItem('tv-user', JSON.stringify(u));
        document.getElementById('profileName').textContent = u.firstName + ' ' + u.lastName;
        document.getElementById('profileUsername').textContent = '@' + u.username;
        document.getElementById('profileEmail').textContent = u.email;
      } catch(e) {
        if (user) {
          document.getElementById('profileName').textContent = user.firstName + ' ' + (user.lastName || '');
          document.getElementById('profileUsername').textContent = '@' + (user.username || '');
          document.getElementById('profileEmail').textContent = user.email || '';
        }
      }
    }

    async function loadMyEvents() {
      try {
        const res = await fetch('/api/meetings');
        const all = await res.json();
        const mine = all.filter(e => e.creatorId === user.id);
        const el = document.getElementById('myEvents');
        if (!mine.length) { el.innerHTML = '<p style="color:var(--muted);font-size:0.9rem;">Noch keine Events erstellt.</p>'; return; }
        el.innerHTML = mine.map(e => `
          <article class="event-row" style="margin-bottom:8px;">
            <a class="event-card" href="event-details.html?id=${e.id}" style="flex:1;">
              <h3 class="event-title">${e.title}</h3>
              <p class="event-meta">${e.locationName || ''}</p>
            </a>
            <button onclick="deleteEvent(${e.id})" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:8px;" aria-label="Löschen">🗑️</button>
          </article>`).join('');
      } catch(e) {}
    }

    async function deleteEvent(id) {
      if (!confirm('Event wirklich löschen?')) return;
      await fetch(`/api/meetings/${id}`, { method: 'DELETE' });
      loadMyEvents();
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      localStorage.removeItem('tv-user');
      window.location.href = 'login.html';
    }

    loadProfile();
    loadMyEvents();
  </script>
</body>
</html>
