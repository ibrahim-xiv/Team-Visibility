<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>
  <main class="phone">
    <header class="header">
      <div class="brand" aria-label="Visibility">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>
        </span>
        <span>Visibility</span>
      </div>
    </header>
    <section class="content form-content">
      <h2 style="margin:0 0 20px;font-size:1.6rem;font-weight:800;text-align:center;">Anmelden</h2>
      <div id="errorMsg" style="display:none;color:#ef4444;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:0.9rem;"></div>
      <form id="loginForm" class="register-form" novalidate>
        <div class="form-group">
          <label for="email">E-Mail</label>
          <input class="input" id="email" type="email" placeholder="name@email.de" required>
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input class="input" id="password" type="password" placeholder="******" required>
        </div>
        <button class="submit-btn" type="submit" id="submitBtn">Anmelden</button>
        <a class="login-link" href="register.html">Noch kein Konto? Registrieren &gt;</a>
        <a class="login-link" href="forgot-password.html" style="margin-top:8px;display:block;font-size:0.88rem;color:var(--muted);">Passwort vergessen?</a>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      btn.disabled = true; btn.textContent = 'Wird angemeldet…';
      errEl.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Anmeldung fehlgeschlagen');
        localStorage.setItem('tv-user', JSON.stringify(data));
        window.location.href = 'home.html';
      } catch(err) {
        if (err.message === 'DELETED_ACCOUNT') {
          if (confirm('Dein Konto ist zur Löschung markiert. Möchtest du es wiederherstellen?')) {
            const rr = await fetch('/api/auth/restore-account', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body:JSON.stringify({email:document.getElementById('email').value.trim(), password:document.getElementById('password').value})
            });
            const rd = await rr.json();
            if (rr.ok) { alert('Konto wiederhergestellt! Bitte erneut anmelden.'); location.reload(); }
            else { errEl.textContent = rd.error || rd.message || 'Fehler'; errEl.style.display = 'block'; }
          }
        } else {
          errEl.textContent = err.message;
          errEl.style.display = 'block';
        }
        btn.disabled = false; btn.textContent = 'Anmelden';
      }
    });
  </script>
</body>
</html>
