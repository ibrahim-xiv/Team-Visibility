<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Gespeicherte Inhalte</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Handy-Rahmen -->
  <main class="phone is-feed">

    <!-- Sticky Header -->
    <div class="header-wrap" id="top">
      <header class="header">
        <div class="brand" aria-label="Visibility">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path>
              <circle cx="12" cy="12" r="3.2"></circle>
            </svg>
          </span>
          <span>Visibility</span>
        </div>
      </header>

      <!-- Toolbar -->
      <div class="toolbar-wrap">
        <div class="toolbar">
          <input id="searchInput" class="search-input" type="text" placeholder="In Favoriten suchen..." aria-label="Gespeicherte Events suchen">
          <select id="sortSelect" aria-label="Sortieren">
            <option value="distance">Entfernung</option>
            <option value="date">Datum</option>
            <option value="title">Titel A–Z</option>
          </select>
          <select id="filterSelect" aria-label="Filtern">
            <option value="all">Alle</option>
            <option>Freizeit</option>
            <option>Sport</option>
            <option>Spieleabend</option>
            <option>Kultur</option>
            <option>Community</option>
            <option>Anderes…</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Scrollbarer Hauptbereich -->
    <div class="scroll-area" id="scrollArea">
      <section class="content">

        <!-- Kartenansicht Button -->
        <a class="map-cta" href="map.html" aria-label="Zur Kartenansicht" style="margin-bottom: 25px;">
          <span>Zur Kartenansicht</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11z"></path>
            <circle cx="12" cy="10" r="2.2"></circle>
          </svg>
        </a>

        <!-- EIGENE TREFFEN -->
        <div class="section-head">
          <h2>Meine Treffen:</h2>
          <span class="results-count" id="myEventsCount">0 Treffen</span>
        </div>
        
        <div id="myEventsList" class="event-list"></div>
        
        <div id="myEventsEmpty" class="empty-state">
          Du hast noch kein eigenes Treffen erstellt.
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 25px 0;">

        <!-- GESPEICHERTE FAVORITEN -->
        <div class="section-head">
          <h2 id="sectionTitle">Gespeicherte Favoriten:</h2>
          <span class="results-count" id="resultsCount">0 Favoriten</span>
        </div>

        <div class="event-list" id="eventList"></div>
        <div class="empty-state" id="emptyState">Keine Favoriten gespeichert.</div>

      </section>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a class="nav-btn" href="home.html" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"></path></svg>
      </a>
      <a class="nav-btn" href="chat.html" aria-label="Chat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>
      </a>
      <a class="nav-btn is-primary" href="meeting-form.html" aria-label="Treffen erstellen">+</a>
      <a class="nav-btn saved-btn is-active" href="saved.html" aria-label="Gespeicherte Inhalte">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg>
      </a>
      <a class="nav-btn" href="profile.html" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"></path></svg>
      </a>
    </nav>
  </main>

  <script>
    const STORAGE_KEY = 'visibility-saved-events';
    const MY_EVENTS_KEY = 'lastCreatedEventTitle';

    // Hilfsfunktionen
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    // Daten laden
    let savedEvents = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: 'brettspiel', title: 'Brettspielabend', category: 'Spieleabend', emoji: '🎲', location: 'Jugendherberge', distance: 1.2, date: '2026-04-18', dateText: 'Samstag 18.04.' },
      { id: 'hunde', title: 'Hundespaziergang', category: 'Community', emoji: '👥', location: 'Nordsee', distance: 2.4, date: '2026-03-31', dateText: 'Dienstag 31.03.' }
    ];

    // EIGENE EVENTS RENDERN
    function renderMyEvents() {
      const list = $('#myEventsList');
      const empty = $('#myEventsEmpty');
      const count = $('#myEventsCount');
      const title = localStorage.getItem(MY_EVENTS_KEY);

      if (title) {
        empty.style.display = 'none';
        count.textContent = "1 Treffen";
        list.innerHTML = `
          <article class="event-row">
            <div class="event-card" style="border-left: 4px solid #3b342e;">
              <div class="event-badge"><span>⭐</span><span>Eigenes Treffen</span></div>
              <h3 class="event-title">${title}</h3>
              <p class="event-meta">Gerade eben erstellt</p>
              <p class="event-location">Wilhelmshaven (Dein Standort)</p>
            </div>
            <div class="event-side">
               <button class="icon-btn" onclick="deleteMyEvent()" aria-label="Löschen">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
               </button>
            </div>
          </article>
        `;
      } else {
        list.innerHTML = '';
        empty.style.display = 'block';
        count.textContent = "0 Treffen";
      }
    }

    function deleteMyEvent() {
      if(confirm("Eigenes Treffen löschen?")) {
        localStorage.removeItem(MY_EVENTS_KEY);
        renderMyEvents();
      }
    }

    // FAVORITEN RENDERN
    function renderFavoriten(list) {
      const eventList = $('#eventList');
      const emptyState = $('#emptyState');
      
      eventList.innerHTML = list.map(e => `
        <article class="event-row">
          <a class="event-card" href="#">
            <div class="event-badge"><span>${e.emoji}</span><span>${e.category}</span></div>
            <h3 class="event-title">${e.title}</h3>
            <p class="event-meta">${e.dateText}</p>
            <p class="event-location">${e.location} – ${e.distance} km</p>
          </a>
          <div class="event-side">
            <button class="icon-btn" onclick="unsave('${e.id}')">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg>
            </button>
          </div>
        </article>
      `).join('');

      $('#resultsCount').textContent = `${list.length} Favoriten`;
      emptyState.style.display = list.length ? 'none' : 'block';
    }

    function unsave(id) {
      savedEvents = savedEvents.filter(ev => ev.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedEvents));
      filterAndSort();
    }

    function filterAndSort() {
      const q = $('#searchInput').value.toLowerCase();
      const f = $('#filterSelect').value;
      let list = savedEvents.filter(e => 
        (e.title.toLowerCase().includes(q)) && (f === 'all' || e.category === f)
      );
      renderFavoriten(list);
    }

    $('#searchInput').oninput = filterAndSort;
    $('#filterSelect').onchange = filterAndSort;

    // Start
    renderMyEvents();
    filterAndSort();
  </script>

<!-- DEV-DASHBOARD GANZ UNTEN VOR DEM SCHLIEẞENDEN BODY -->
  <nav class="dev-nav">
    <div class="dev-nav-header">DEV-Navigation</div>
    
    <div><a href="login.html" class="dev-btn">🔑 Login</a></div>
    <div><a href="register.html" class="dev-btn">📝 Registrieren</a></div>
    <div><a href="home.html" class="dev-btn">🏠 Home</a></div>
    <div><a href="meeting-form.html" class="dev-btn">➕ Erstellen</a></div>
    <div><a href="saved.html" class="dev-btn">💾 Gespeichert</a></div>
    
    <div class="dev-btn is-disabled">🚫👤 Profil</div>
    <div class="dev-btn is-disabled">🚫🗺️ Karten ansicht</div>
    <div class="dev-btn is-disabled">🚫📝 Event Details</div>
    <div class="dev-btn is-disabled">🚫💬 Chat</div>
  </nav>

</body>
</html>
