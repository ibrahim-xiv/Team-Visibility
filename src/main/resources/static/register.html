<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visibility – Registrierung</title>

  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --hover-bg: #efefef;
      --text: #262626;
      --muted: #8e8e8e;
      --hint: #a8a8a8;

      --primary: #0095f6;
      --primary-hover: #1877f2;

      --border: #dbdbdb;
      --radius-lg: 34px;
      --radius-md: 14px;
      --radius-sm: 10px;

      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --error: #ed4956;
      --error-bg: #fef2f2;
    }

    body.dark-mode {
      --bg: #1d1c1c;
      --surface: #1d1c1c;
      --hover-bg: #2e2d2d;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --hint: #8e8e8e;
      --border: #363434;
      --shadow: none;
      --error-bg: #2c1a1a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .phone {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .header {
      padding: 22px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.8rem;
      font-weight: 800;
    }

    .content {
      padding: 24px 18px;
    }

    h2 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 1.6rem;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .input:focus {
      border-color: var(--primary);
    }

    .hint-text {
      margin-top: 6px;
      color: var(--hint);
      font-size: .85rem;
    }

    .submit-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .login-link {
      text-align: center;
      display: block;
      margin-top: 10px;
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .error-text {
      display: none;
      margin-top: 6px;
      color: var(--error);
      font-size: .85rem;
      font-weight: 700;
    }

    .is-invalid .error-text {
      display: block;
    }

    .is-invalid .input {
      border-color: var(--error);
      background: var(--error-bg);
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-content {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .code-wrap {
      margin: 20px 0;
    }

    .code-inputs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .code-input {
      width: 100%;
      height: 52px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      border: none;
      border-bottom: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .code-input:focus {
      border-bottom-color: var(--primary);
    }

    .btn-send-code,
    .btn-confirm {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-send-code {
      background: #22c55e;
      color: white;
      margin-bottom: 10px;
    }

    .btn-send-code:hover {
      background: #16a34a;
    }

    .btn-send-code:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-confirm {
      background: var(--primary);
      color: white;
    }

    .btn-confirm:hover {
      background: var(--primary-hover);
    }

    @media (max-width: 580px) {
      body {
        padding: 0;
      }

      .phone {
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>

<body>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <main class="phone">

    <header class="header">
      <div class="brand">
        <span>👁️</span>
        <span>Visibility</span>
      </div>
    </header>

    <section class="content">

      <h2>Register</h2>

      <form id="registerForm" novalidate>

        <!-- Vorname -->
        <div class="form-group" data-field="firstname">
          <label for="firstname">Vorname</label>
          <input class="input" id="firstname" type="text" placeholder="Max">
          <div class="error-text">Bitte Vornamen eingeben.</div>
        </div>

        <!-- Nachname -->
        <div class="form-group" data-field="lastname">
          <label for="lastname">Nachname</label>
          <input class="input" id="lastname" type="text" placeholder="Mustermann">
          <div class="error-text">Bitte Nachnamen eingeben.</div>
        </div>

        <!-- Email -->
        <div class="form-group" data-field="email">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="name@email.de">
          <div class="error-text">Bitte gültige Email eingeben.</div>
        </div>

        <!-- Passwort -->
        <div class="form-group" data-field="password">
          <label for="password">Passwort</label>

          <input class="input" id="password" type="password" placeholder="******">

          <div class="hint-text">
            Mindestens 1 Großbuchstabe und 1 Zahl.
          </div>

          <div class="error-text">
            Passwort ungültig.
          </div>
        </div>

        <button class="submit-btn" type="submit">
          Registrieren
        </button>

        <a class="login-link" href="login.html">
          Bereits registriert? Anmelden >
        </a>

      </form>

    </section>
  </main>

  <!-- VERIFIZIERUNGS MODAL -->

  <div class="modal-overlay" id="verifyModal">

    <div class="modal-content">

      <h2>Code bestätigen</h2>

      <p style="color: var(--muted); margin-top: 8px;">
        Wir haben dir einen 5-stelligen Code gesendet.
      </p>

      <div class="code-wrap">

        <div class="code-inputs">

          <input class="code-input" type="text" maxlength="1">
          <input class="code-input" type="text" maxlength="1">
          <input class="code-input" type="text" maxlength="1">
          <input class="code-input" type="text" maxlength="1">
          <input class="code-input" type="text" maxlength="1">

        </div>

      </div>

      <button class="btn-send-code" id="sendCodeBtn">
        Code senden
      </button>

      <button class="btn-confirm" id="confirmCodeBtn">
        Bestätigen
      </button>

    </div>

  </div>

  <script>

    // FORM

    const form = document.getElementById('registerForm');

    const firstnameInput = document.getElementById('firstname');
    const lastnameInput = document.getElementById('lastname');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // MODAL

    const verifyModal = document.getElementById('verifyModal');

    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const confirmCodeBtn = document.getElementById('confirmCodeBtn');

    const codeInputs = [...document.querySelectorAll('.code-input')];

    // VALIDIERUNG

    const isEmailValid = v =>
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

    const isPasswordValid = v =>
      /[A-Z]/.test(v) && /[0-9]/.test(v);

    function setInvalid(field, invalid) {

      const wrapper =
        document.querySelector(`[data-field="${field}"]`);

      wrapper.classList.toggle('is-invalid', invalid);

    }

    function validateForm() {

      let valid = true;

      if (!firstnameInput.value.trim()) {
        setInvalid('firstname', true);
        valid = false;
      } else {
        setInvalid('firstname', false);
      }

      if (!lastnameInput.value.trim()) {
        setInvalid('lastname', true);
        valid = false;
      } else {
        setInvalid('lastname', false);
      }

      if (!isEmailValid(emailInput.value.trim())) {
        setInvalid('email', true);
        valid = false;
      } else {
        setInvalid('email', false);
      }

      if (!isPasswordValid(passwordInput.value)) {
        setInvalid('password', true);
        valid = false;
      } else {
        setInvalid('password', false);
      }

      return valid;

    }

    function validateCode() {

      return codeInputs.every(input =>
        input.value.trim().length === 1
      );

    }

    // REGISTRIEREN

    form.addEventListener('submit', e => {

      e.preventDefault();

      if (!validateForm()) return;

      verifyModal.style.display = 'flex';

    });

    // CODE EINGABE

    codeInputs.forEach((input, index) => {

      input.addEventListener('input', () => {

        input.value = input.value
          .replace(/[^0-9]/g, '')
          .slice(0, 1);

        if (input.value && index < codeInputs.length - 1) {
          codeInputs[index + 1].focus();
        }

      });

      input.addEventListener('keydown', e => {

        if (
          e.key === 'Backspace' &&
          !input.value &&
          index > 0
        ) {
          codeInputs[index - 1].focus();
        }

      });

    });

    // CODE SENDEN + TIMER

    let countdown = 60;
    let timer = null;
    let codeAlreadySent = false;

    function updateButtonText() {

      sendCodeBtn.textContent =
        `Erneut senden in ${countdown}s`;

    }

    function startCountdown() {

      clearInterval(timer);

      countdown = 60;

      sendCodeBtn.disabled = true;

      updateButtonText();

      timer = setInterval(() => {

        countdown--;

        updateButtonText();

        if (countdown <= 0) {

          clearInterval(timer);

          sendCodeBtn.disabled = false;

          sendCodeBtn.textContent = codeAlreadySent
            ? 'Code erneut senden'
            : 'Code senden';

        }

      }, 1000);

    }

    sendCodeBtn.addEventListener('click', () => {

      alert(
        codeAlreadySent
          ? 'Neuer Verifizierungs-Code wurde gesendet.'
          : 'Verifizierungs-Code wurde gesendet.'
      );

      codeAlreadySent = true;

      startCountdown();

    });

    // BESTÄTIGEN

    confirmCodeBtn.addEventListener('click', () => {

      if (!validateCode()) {

        alert('Bitte vollständigen Code eingeben.');

        return;

      }

      const payload = {

        firstname: firstnameInput.value.trim(),

        lastname: lastnameInput.value.trim(),

        email: emailInput.value.trim(),

        password: passwordInput.value,

        verificationCode:
          codeInputs.map(i => i.value).join('')

      };

      console.log(payload);

      verifyModal.style.display = 'none';

      window.location.href = 'home.html';

    });

    // MODAL SCHLIESSEN

    verifyModal.addEventListener('click', e => {

      if (e.target === verifyModal) {

        verifyModal.style.display = 'none';

      }

    });

  </script>

</body>

</html>
