<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrierung – Visibility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <header class="header">
      <div class="brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>
        </span>
        <span>Visibility</span>
      </div>
    </header>

    <section class="content">
      <h2 class="page-title">Registrierung</h2>
      
      <form class="reg-form">
        <label>
          Vorname
          <input type="text" placeholder="Max">
        </label>
        <label>
          Nachname
          <input type="text" placeholder="Mustermann">
        </label>
        <label>
          Email/Telefon Nr.
          <input type="text" placeholder="name@email.de">
        </label>
        <label>
          Passwort
          <input type="password" placeholder="••••••">
        </label>
        <button type="submit" class="map-cta">Registrieren</button>
      </form>

      <div class="footer-link">
        <a href="/login.html">Bereits registriert? Anmelden ></a>
      </div>
    </section>
  </main>
</body>
</html>
