<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visibility – Passwort zurücksetzen</title>
  <link rel="stylesheet" href="style.css?v=5"/>
</head>
<body>
<script>if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');</script>
<main class="phone">
  <header class="header">
    <div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="3.2"></circle></svg></span><span>Visibility</span></div>
  </header>
  <section class="content form-content">
    <h2 style="margin:0 0 8px;font-size:1.4rem;font-weight:800;text-align:center;">Passwort zurücksetzen</h2>
    <p style="text-align:center;color:var(--muted);font-size:0.88rem;margin-bottom:20px;">Wir senden dir einen Code per E-Mail.</p>
    <div id="errorMsg" style="display:none;color:#ef4444;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:0.9rem;"></div>
    <div id="successMsg" style="display:none;color:#16a34a;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:0.9rem;"></div>

    <!-- Step 1: Email -->
    <form id="step1" class="register-form" novalidate>
      <div class="form-group"><label for="email">E-Mail</label><input class="input" id="email" type="email" placeholder="name@email.de" required></div>
      <button class="submit-btn" type="submit" id="sendBtn">Code senden</button>
      <a class="login-link" href="login.html">Zurück zum Login</a>
    </form>

    <!-- Step 2: Code + new password -->
    <form id="step2" class="register-form" style="display:none;" novalidate>
      <p style="text-align:center;color:var(--muted);margin-bottom:16px;font-size:0.88rem;">Code wurde an <strong id="emailDisplay"></strong> gesendet.</p>
      <div class="form-group"><label>Code (5 Ziffern)</label>
        <div style="display:flex;gap:8px;justify-content:center;">
          <input class="input code-input" type="text" maxlength="1" inputmode="numeric" style="width:48px;text-align:center;font-size:1.2rem;font-weight:800;">
          <input class="input code-input" type="text" maxlength="1" inputmode="numeric" style="width:48px;text-align:center;font-size:1.2rem;font-weight:800;">
          <input class="input code-input" type="text" maxlength="1" inputmode="numeric" style="width:48px;text-align:center;font-size:1.2rem;font-weight:800;">
          <input class="input code-input" type="text" maxlength="1" inputmode="numeric" style="width:48px;text-align:center;font-size:1.2rem;font-weight:800;">
          <input class="input code-input" type="text" maxlength="1" inputmode="numeric" style="width:48px;text-align:center;font-size:1.2rem;font-weight:800;">
        </div>
      </div>
      <div class="form-group"><label for="newPassword">Neues Passwort</label><input class="input" id="newPassword" type="password" placeholder="Mind. 1 Großbuchstabe + 1 Zahl" required></div>
      <button class="submit-btn" type="submit" id="resetBtn">Passwort ändern</button>
    </form>
  </section>
</main>
<script src="app.js?v=5"></script>
<script>
let savedEmail='';
function showError(m){document.getElementById('errorMsg').textContent=m;document.getElementById('errorMsg').style.display='block';document.getElementById('successMsg').style.display='none';}
function showSuccess(m){document.getElementById('successMsg').textContent=m;document.getElementById('successMsg').style.display='block';document.getElementById('errorMsg').style.display='none';}

document.getElementById('step1').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('sendBtn');btn.disabled=true;btn.textContent='Wird gesendet…';
  savedEmail=document.getElementById('email').value.trim();
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:savedEmail})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||d.message||'Fehler');
    document.getElementById('emailDisplay').textContent=savedEmail;
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    showSuccess('Code wurde gesendet!');
  }catch(err){showError(err.message);btn.disabled=false;btn.textContent='Code senden';}
});

const codeInputs=[...document.querySelectorAll('.code-input')];
codeInputs.forEach((inp,i)=>{
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,1);if(inp.value&&i<codeInputs.length-1)codeInputs[i+1].focus();});
  inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)codeInputs[i-1].focus();});
});

document.getElementById('step2').addEventListener('submit',async e=>{
  e.preventDefault();
  const code=codeInputs.map(i=>i.value).join('');
  if(code.length!==5){showError('Bitte vollständigen Code eingeben.');return;}
  const pw=document.getElementById('newPassword').value;
  if(!pw||pw.length<4){showError('Passwort zu kurz.');return;}
  const btn=document.getElementById('resetBtn');btn.disabled=true;btn.textContent='Wird geändert…';
  try{
    const r=await fetch('/api/auth/reset-with-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:savedEmail,code,password:pw})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||d.message||'Fehler');
    showSuccess('Passwort erfolgreich geändert! Du wirst weitergeleitet…');
    setTimeout(()=>window.location.href='login.html',1500);
  }catch(err){showError(err.message);btn.disabled=false;btn.textContent='Passwort ändern';}
});
</script>
</body></html>
